name: build-windows

# 在 Windows 上用 Nuitka 构建 excel2md.exe，并把产物作为 artifact 上传。
# 触发：推送 main/master、打 v* 标签、或手动运行。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # Nuitka 需要 C 编译器；用 GitHub runner 自带 MSVC，避免下载 MinGW。
      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Nuitka
        run: uv run python build.py

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke_in | Out-Null
          uv run python -c "import openpyxl; wb=openpyxl.Workbook(); ws=wb.active; ws.append(['a','b']); ws.append([1,2]); wb.save('smoke_in/smoke.xlsx')"
          .\build\excel2md.dist\excel2md.exe --input smoke_in --output smoke_out --state smoke_state.json
          if (-not (Test-Path 'smoke_out\smoke\Sheet.md')) { throw 'smoke test failed: expected smoke_out\smoke\Sheet.md' }

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path build\excel2md.dist -DestinationPath excel2md-win.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: excel2md-win
          path: excel2md-win.zip
          if-no-files-found: error
