name: build-windows

# 在 Windows 上用 Nuitka 构建 excel2md.exe，并把产物作为 artifact 上传。
# 触发：推送 main/master、打 v* 标签、或手动运行。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # GitHub-hosted 单 job 上限 6h；设 3h 安全阀，卡死时提前失败而不是烧满额度
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # Nuitka 需要 C 编译器；用 GitHub runner 自带 MSVC，避免下载 MinGW。
      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Nuitka
        run: uv run python build.py

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke_in | Out-Null
          uv run python -c "import openpyxl; wb=openpyxl.Workbook(); ws=wb.active; ws.append(['a','b']); ws.append([1,2]); wb.save('smoke_in/smoke.xlsx')"
          $exe = Get-ChildItem -Path build -Recurse -Filter excel2md.exe | Select-Object -First 1
          if (-not $exe) { throw 'excel2md.exe not found under build/' }
          & $exe.FullName --input smoke_in --output smoke_out --state smoke_state.json
          if (-not (Test-Path 'smoke_out\smoke\Sheet.md')) { throw 'smoke test failed: expected smoke_out\smoke\Sheet.md' }

      - name: Package artifact
        shell: pwsh
        run: |
          $dist = Get-ChildItem -Path build -Directory -Filter *.dist | Select-Object -First 1
          if (-not $dist) { throw 'no *.dist directory under build/' }
          Compress-Archive -Path $dist.FullName -DestinationPath excel2md-win.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: excel2md-win
          path: excel2md-win.zip
          if-no-files-found: error
